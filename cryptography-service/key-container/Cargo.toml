[package]
name = "keyd"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[dependencies]
aws-lc-rs = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
libc = "0.2"
