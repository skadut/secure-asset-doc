<?xml version="1.0" encoding="UTF-8"?>
<!-- Cracked earth background, adapted from a snippet supplied by the user, credit line "From Uiverse.io by UserNameSekhar". Original catalogue URL not verified. Pre-rendered static tile: the filter runs inside the SVG image pipeline, not on the DOM. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <filter id="cracks" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="10" result="noise"/>
    <feColorMatrix in="noise" type="luminanceToAlpha" result="lum"/>
    <feComponentTransfer in="lum" result="discrete">
      <feFuncA type="discrete" tableValues="0 1"/>
    </feComponentTransfer>
    <feConvolveMatrix in="discrete" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" result="edges"/>
    <feComponentTransfer in="edges" result="inverted">
      <feFuncR type="table" tableValues="1 0"/>
      <feFuncG type="table" tableValues="1 0"/>
      <feFuncB type="table" tableValues="1 0"/>
    </feComponentTransfer>
    <feFlood flood-color="#3d3a36" result="ink"/>
    <feComposite in="ink" in2="inverted" operator="in"/>
  </filter>
  <rect width="1024" height="1024" fill="#f5f5f4"/>
  <rect width="1024" height="1024" fill="#000" filter="url(#cracks)" opacity="0.14"/>
</svg>
